# Stage 1: Pre-Ulcerative Insole Telemetry Configuration

sampling_rate: 20  # Hz (FSR)
rh_sampling_rate: 1  # Hz (Sudomotor RH%)
temp_sampling_rate: 1 # Hz (Plantar thermistors)

window_size: 100    # 5 seconds at 20Hz
stride: 20          # 1 second stride

model:
  in_channels: 18   # 16 FSR + 1 RH + 1 ΔT
  conv_channels: [32, 64, 128]
  d_model: 128
  nhead: 4
  num_layers: 3
  dim_feedforward: 256
  dropout: 0.1

trigger_thresholds:
  delta_t_celsius: 2.2
  hazard_score: 0.65
