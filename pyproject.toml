[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfu-multistage-ai"
version = "0.1.0"
description = "A Multi-Stage AI System for Diabetic Foot Ulcer Early Detection, Differential Diagnosis & Remission Surveillance"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sagnik Basu", email = "sagnikbasutaan2004@gmail.com" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pillow>=9.5.0",
    "opencv-python>=4.7.0",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "transformers>=4.30.0",
    "pytorch-tabnet>=4.0",
    "nashpy>=0.0.35",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pytest>=7.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort"
]
